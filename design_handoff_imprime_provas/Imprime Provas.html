<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Imprime Provas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
<style>
  :root {
    --black: #010400;
    --pine: #297373;
    --coral: #FF8552;
    --alabaster: #E3E3E3;
    --graphite: #39393A;

    --accent: #FF8552;
    --app-bg: #fafaf9;
    --panel: #ffffff;
    --canvas-bg: #e3e3e3;
    --ink: #010400;
    --muted: #6c6c6d;
    --line: rgba(1, 4, 0, 0.14);
    --hairline: rgba(1, 4, 0, 0.08);

    --serif: 'Baskervville', Georgia, 'Times New Roman', serif;
    --mono: 'SFMono-Regular', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--serif);
    color: var(--ink);
    background: var(--app-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { height: 100%; }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .app-header {
    flex: 0 0 auto;
    height: 60px;
    padding: 0 26px;
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--hairline);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark {
    width: 16px; height: 16px; border-radius: 4px;
    background: var(--pine);
    box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.85), 0 0 0 1px var(--pine);
  }
  .brand-name { font-size: 21px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
  .brand { flex: 0 0 auto; }
  .app-sub { font-size: 14.5px; color: var(--muted); font-style: italic; margin-left: 4px; padding-left: 18px; border-left: 1px solid var(--hairline); }

  /* Workspace */
  .workspace {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(360px, 0.82fr) 1.18fr;
  }

  /* Editor */
  .editor {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--hairline);
    padding: 22px 24px 18px;
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .panel-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .hint { font-size: 13px; color: var(--muted); }

  .script-input {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fcfcfb;
    padding: 18px 20px;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink);
    tab-size: 2;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .script-input::placeholder { color: #b7b7b6; }
  .script-input:focus {
    border-color: var(--pine);
    box-shadow: 0 0 0 3px rgba(41, 115, 115, 0.12);
  }

  .legend {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .legend code {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    background: #f0f0ee;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 4px 8px;
  }

  /* Preview */
  .preview-pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--canvas-bg);
  }
  .canvas {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 38px 0 46px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .paper {
    width: 210mm;
    max-width: calc(100% - 64px);
    min-height: 297mm;
    background: #fff;
    color: #111;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 18px 44px rgba(0,0,0,.16);
    padding: 22mm 20mm 24mm;
    font-size: 11pt;
    line-height: 1.55;
  }

  .pp-head { border-bottom: 1.5px solid #111; padding-bottom: 14px; margin-bottom: 22px; }
  .pp-title { margin: 0; font-size: 1.85em; font-weight: 700; text-align: center; letter-spacing: 0.01em; }
  .pp-meta {
    margin-top: 9px;
    text-align: center;
    font-size: 0.92em;
    line-height: 1.5;
    color: #333;
  }
  .pp-meta-item { display: inline-block; margin: 0 11px; }
  .pp-meta-item b { font-weight: 700; }

  .pp-fields {
    margin-top: 16px;
    display: flex;
    align-items: flex-end;
    gap: 18px;
  }
  .pp-field { display: flex; align-items: baseline; gap: 7px; }
  .pp-field.grow { flex: 1 1 auto; }
  .pp-field span, .pp-grade span { font-size: 0.88em; color: #333; white-space: nowrap; }
  .pp-field i { display: block; flex: 1 1 auto; min-width: 60px; border-bottom: 1px solid #999; height: 1.1em; }
  .pp-field:not(.grow) i { width: 90px; }
  .pp-grade { display: flex; align-items: center; gap: 8px; }
  .pp-grade-box { width: 64px; height: 42px; border: 1.5px solid #111; border-radius: 3px; }

  .pp-section {
    margin: 26px 0 12px;
    font-size: 1.05em;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #111;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
  .pp-text { margin: 0 0 10px; color: #333; font-style: italic; }

  .pp-q { margin: 0 0 20px; break-inside: avoid; }
  .pp-q-stmt { margin: 0 0 8px; display: grid; grid-template-columns: auto 1fr; column-gap: 9px; align-items: baseline; font-weight: 400; }
  .pp-q-num { font-weight: 700; color: var(--accent); }
  .pp-q-stmt > span:last-child { text-wrap: pretty; }

  .pp-opts { list-style: none; margin: 0; padding: 0 0 0 26px; display: flex; flex-direction: column; gap: 6px; }
  .pp-opts li { display: grid; grid-template-columns: 1.5em 1fr; column-gap: 6px; align-items: baseline; }
  .pp-opt-mark { font-weight: 700; }

  .pp-lines { padding-left: 26px; display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
  .pp-line { display: block; height: 1.75em; border-bottom: 1px solid #c7c7c7; }

  .pp-empty { color: #aaa; font-style: italic; text-align: center; margin-top: 30px; }

  /* Footer / print button */
  .preview-footer {
    flex: 0 0 auto;
    height: 76px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border-top: 1px solid var(--hairline);
  }
  .paper-tag { font-size: 13px; color: var(--muted); letter-spacing: 0.03em; }
  .btn-print {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 13px 28px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(255, 133, 82, 0.32);
    transition: transform .12s ease, filter .15s ease, box-shadow .15s ease;
  }
  .btn-print:hover { filter: brightness(1.04); box-shadow: 0 4px 14px rgba(255, 133, 82, 0.42); }
  .btn-print:active { transform: translateY(1px); }
  .btn-print svg { stroke: #fff; }

  /* Print */
  @media print {
    .app-header, .editor, .preview-footer, .twk-panel { display: none !important; }
    html, body, #root, .app, .workspace, .preview-pane { height: auto !important; display: block !important; background: #fff !important; }
    .canvas { overflow: visible !important; padding: 0 !important; display: block !important; background: #fff !important; }
    .paper {
      width: auto !important;
      max-width: none !important;
      min-height: 0 !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    @page { size: A4; margin: 16mm 15mm; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
